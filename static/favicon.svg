<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="airdrop-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077ed"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
  </defs>
  <!-- Apple-inspired squircle container -->
  <rect width="32" height="32" rx="7.5" fill="url(#airdrop-bg)"/>
  
  <!-- Outer radiating wireless pulse ring -->
  <circle cx="16" cy="16" r="11" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="14 8" stroke-linecap="round"/>
  
  <!-- Mid wireless wave ring -->
  <circle cx="16" cy="16" r="7.5" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.75" stroke-linecap="round"/>
  
  <!-- Inner directional node -->
  <circle cx="16" cy="16" r="3.2" fill="#ffffff"/>
  
  <!-- Symmetric transfer coordinate pips -->
  <circle cx="16" cy="7" r="1.2" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="16" cy="25" r="1.2" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="7" cy="16" r="1.2" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="25" cy="16" r="1.2" fill="#ffffff" fill-opacity="0.85"/>
</svg>
